name: Pull Request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
      - "!main"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  pr-checks:
    uses: lukaszraczylo/shared-actions/.github/workflows/go-pr.yaml@main
    with:
      go-version: "1.27.x"
      coverage-threshold: 75
    secrets: inherit

  yaegi-validate:
    name: Yaegi interpreter compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # tools/yaegi-check pins yaegi v0.16.1, the interpreter Traefik vendors,
      # so this runs the plugin under the interpreter a release runs under.
      # It imports the plugin, calls CreateConfig and New across the reflect
      # boundary, decodes .traefik.yml testData and drives payment flows.
      - name: Run yaegi checks
        run: make yaegi-check

  e2e:
    name: End-to-end on Traefik
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # Starts traefik:v3.7 with the plugin as a local plugin, plus a mock
      # facilitator and upstream on the runner.
      - name: Run end-to-end tests
        run: make e2e
