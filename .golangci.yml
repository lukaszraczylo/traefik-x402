version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - goconst
    - gocritic
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
          - noctx
          - unparam
          - errcheck
